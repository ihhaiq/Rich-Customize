[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/miniapp_static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
