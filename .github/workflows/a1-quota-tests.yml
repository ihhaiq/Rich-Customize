name: Rich Editor regression suite

on:
  push:
    branches:
      - serverless-cleanup
    paths:
      - '.github/workflows/a1-quota-tests.yml'
      - 'tgcloud/lib/**'
      - 'tgcloud/handlers/**'
      - 'tgcloud/schema.js'
      - 'app/miniapp_static/**'
      - 'scripts/**'
      - 'functions/_lib/**'
      - 'tests/serverless/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-tests:
    name: Serverless and Mini App validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate plan data, Mini App assets and regression tests
        run: npm run test:ci
