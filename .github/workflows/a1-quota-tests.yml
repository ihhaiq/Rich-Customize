name: A1 subscription quotas tests

on:
  push:
    branches:
      - serverless-cleanup
    paths:
      - '.github/workflows/a1-quota-tests.yml'
      - 'tgcloud/lib/**'
      - 'functions/_lib/**'
      - 'tests/serverless/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-tests:
    name: Subscription A1 policy and limits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Serverless regression tests
        run: npm test
