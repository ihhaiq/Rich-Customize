name: tests

on:
  push:
    branches: [main, rich-core-rust-poc]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt maturin==1.9.4
      - name: Build native rich core
        run: python -m maturin develop --release --manifest-path rich_core/Cargo.toml
      - name: Check native rich core
        run: cargo check --manifest-path rich_core/Cargo.toml
      - name: Ruff checks
        run: python -m ruff check .
      - name: Type-check application
        run: python -m mypy app main.py
      - name: Compile Python sources
        run: python -m compileall -q app main.py tests
      - name: Run tests
        run: python -m pytest -q
