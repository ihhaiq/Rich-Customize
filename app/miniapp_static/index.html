<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Rich Customize Beta 0.2</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/miniapp/static/style.css?v=0.2.3">
  <link rel="stylesheet" href="/miniapp/static/media_upload.css?v=0.2.3">
  <link rel="stylesheet" href="/miniapp/static/live_preview.css?v=0.2.3">
</head>
<body>
  <section id="editorView" class="editor-screen">
    <div class="editor-head">
      <header class="editor-topbar">
        <div class="page-identity">
          <input id="pageTitle" maxlength="64" value="Untitled" aria-label="اسم الصفحة">
          <small id="saveState">غير محفوظ</small>
        </div>
        <div class="top-actions">
          <button id="pagesBtn" class="icon-btn" type="button" aria-label="الصفحات المحفوظة">📁</button>
          <button id="moreBtn" class="icon-btn" type="button" aria-label="المزيد">•••</button>
        </div>
      </header>

      <nav class="composer-toolbar" aria-label="أدوات المحرر">
        <button id="undoBtn" type="button" disabled aria-label="تراجع"><b>↶</b></button>
        <button id="redoBtn" type="button" disabled aria-label="إعادة"><b>↷</b></button>
        <span class="toolbar-sep"></span>
        <button type="button" data-tool="text" aria-label="نص"><b>Aa</b></button>
        <button type="button" data-tool="list" aria-label="قائمة"><b>☷</b></button>
        <button type="button" data-tool="table" class="has-badge" aria-label="جدول"><b>▦</b></button>
        <button type="button" data-tool="media" aria-label="مرفق"><b>◨</b></button>
        <button type="button" data-tool="math" class="has-badge" aria-label="معادلة"><b>Σ</b></button>
        <button id="allBlocksBtn" type="button" aria-label="كل البلوكات"><b>＋</b></button>
      </nav>
    </div>

    <main class="editor-main">
      <div id="canvas" class="canvas" aria-label="محرر الرسالة">
        <div id="blocks" class="content-flow"></div>

        <div id="starter" class="starter-card">
          <strong>ابدأ بالرسالة، مو بالإعدادات</strong>
          <p>اكتب مباشرة أو أضف Block. كتابة <b>/</b> تفتح قائمة كل البلوكات.</p>
          <div class="starter-actions">
            <button id="startWritingBtn" type="button" class="primary-soft">¶ ابدأ الكتابة</button>
            <button id="startPhotoBtn" type="button" class="soft-btn">▧ أضف صورة</button>
          </div>
        </div>

        <div class="slash-wrap">
          <textarea id="slashInput" rows="1" placeholder="اكتب نصًا، أو / للأوامر" autocomplete="off" spellcheck="true"></textarea>
          <aside id="slashMenu" class="popup-menu slash-menu hidden" aria-label="قائمة إضافة بلوك">
            <div class="menu-head">
              <span>إضافة Block</span>
              <span id="slashQuery"></span>
            </div>
            <div id="slashItems" class="menu-list"></div>
          </aside>
        </div>
      </div>
    </main>

    <aside id="blockMenu" class="popup-menu block-menu hidden" aria-label="إعدادات البلوك">
      <div id="blockMenuTitle" class="menu-head">إعدادات Block</div>
      <div id="blockActions" class="menu-list"></div>
    </aside>

    <div class="bottom-actions">
      <button id="deleteSelectedBtn" class="fab fab-ghost" type="button" aria-label="حذف البلوك المحدد">🗑</button>
      <button id="sendBtn" class="fab fab-send" type="button" aria-label="إرسال">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11.5 20.5 3 15 20.5l-4.2-6.3L3 11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </section>

  <div id="backdrop" class="backdrop hidden"></div>

  <aside id="pagesPanel" class="sheet hidden" aria-label="الصفحات المحفوظة">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div><strong>📁 الصفحات المحفوظة</strong><small>افتح صفحة أو ابدأ صفحة جديدة</small></div>
      <button id="newPageBtn" class="soft-btn" type="button">＋ جديدة</button>
    </div>
    <div id="pages" class="sheet-list"></div>
    <div id="emptyPages" class="empty hidden">ما عندك صفحات محفوظة.</div>
  </aside>

  <aside id="sendPanel" class="sheet hidden" aria-label="وجهات الإرسال">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div><strong>إرسال الرسالة</strong><small>اختر المحادثة التي تريد النشر بيها</small></div>
    </div>
    <div id="destinations" class="sheet-list"></div>
  </aside>

  <div id="toast" class="toast" role="status"></div>
  <script src="/miniapp/static/app.js?v=0.2.3"></script>
  <script src="/miniapp/static/app_patch.js?v=0.2.3"></script>
  <script src="/miniapp/static/media_upload.js?v=0.2.3"></script>
  <script src="/miniapp/static/live_preview.js?v=0.2.3"></script>
  <script src="/miniapp/static/toolbar_fab.js?v=0.2.3"></script>
</body>
</html>
