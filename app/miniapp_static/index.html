<!doctype html>
<html lang="ar" dir="rtl" style="visibility:hidden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="cache-control" content="no-store">
  <title>Rich Customize</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .gate{width:min(360px,100%);text-align:center}
    .spinner{width:34px;height:34px;margin:0 auto 16px;border:3px solid rgba(255,255,255,.16);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    h1{margin:0 0 8px;font-size:18px}
    p{margin:0;color:#aeb6c2;font-size:14px;line-height:1.7}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (() => {
      const webApp = window.Telegram?.WebApp;
      const initData = webApp?.initData || "";

      if (!initData) {
        window.location.replace("/open-in-telegram.html");
        return;
      }

      document.documentElement.style.visibility = "visible";
      webApp.ready();
      webApp.expand?.();

      const authenticate = async () => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 9000);
        try {
          const response = await fetch("/miniapp/api/session", {
            method: "POST",
            headers: {
              "X-Telegram-Init-Data": initData,
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            cache: "no-store",
            signal: controller.signal
          });

          if (!response.ok) throw new Error("Telegram verification failed");
          const startParam = new URLSearchParams(initData).get("start_param");
          window.location.replace(startParam === "managed_bots" ? "/managed-bots.html" : "/editor.html");
        } catch (_) {
          window.location.replace("/open-in-telegram.html?reason=verification");
        } finally {
          clearTimeout(timer);
        }
      };

      authenticate();
    })();
  </script>
</head>
<body>
  <main class="gate" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>جاري التحقق من جلسة تيليجرام</h1>
    <p>لن يتم تحميل المحرر قبل اكتمال التحقق.</p>
  </main>
</body>
</html>
