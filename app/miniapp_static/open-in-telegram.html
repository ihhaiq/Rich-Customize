<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="cache-control" content="no-store">
  <title>افتح Rich Customize من تيليجرام</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(420px,100%);padding:28px 22px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.055);box-shadow:0 18px 60px rgba(0,0,0,.32);text-align:center}
    .mark{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 18px;border-radius:18px;background:rgba(255,255,255,.09);font-size:28px}
    h1{font-size:20px;margin:0 0 10px}
    p{font-size:14px;line-height:1.8;color:#b8c0ca;margin:0 0 20px}
    a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:16px;background:#fff;color:#0b0d10;text-decoration:none;font-weight:700}
    small{display:block;margin-top:14px;color:#7f8996;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">✦</div>
    <h1>هذا التطبيق يعمل من داخل تيليجرام فقط</h1>
    <p>افتح بوت Rich Customize داخل تيليجرام، ثم استخدم زر فتح التطبيق المصغر.</p>
    <a href="https://t.me/RichCustomizebot">فتح البوت في تيليجرام</a>
    <small>لن يتم تحميل صفحاتك أو مكونات المحرر من المتصفح الخارجي.</small>
  </main>
</body>
</html>
