[package]
name = "rich_core_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rich_core_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
html-escape = "0.2"
pyo3 = { version = "0.22.6", features = ["abi3-py312"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
